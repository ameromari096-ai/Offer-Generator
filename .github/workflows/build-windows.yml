name: Build Windows desktop app

on:
  push:
    branches:
      - claude/offer-agent-contract-generation-qlarqz
    paths:
      - "desktop/**"
      - "webapp/**"
      - "offer_agent/**"
      - "templates/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name OfferAgent `
            --add-data "templates;templates" `
            --add-data "webapp/templates;webapp/templates" `
            --hidden-import requests `
            --hidden-import offer_agent.sharepoint_storage `
            --hidden-import desktop.config `
            desktop/app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfferAgent-windows
          path: dist/OfferAgent.exe
          retention-days: 30
